# إعداد سوبابيز لهذا المودع (يستعمله سير «Push doctor» عند نشر الدالة).
#
# دالة الإرسال تعمل بلا تحقق JWT لأن التحقق عندها بسرّ في الترويسة
# (x-push-secret)، ولا يناديها إلا القاعدة (pg_net) — فلا يلزم توكن مستخدم.
# هذا يُغني عن عَلَم --no-verify-jwt في أوامر النشر.

[functions.send-push]
verify_jwt = false

