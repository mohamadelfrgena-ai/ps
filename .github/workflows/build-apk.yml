# بناء APK تلقائياً على GitHub — شغّله يدوياً من تبويب Actions
# (لا يحتاج أي جهاز محلي، ولا يلمس أي سر: يقرأ المفاتيح من Secrets إن وُجدت)
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, arena/01a0e97c-ps ]
  pull_request:
    branches: [ main ]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform & build-tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Create Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Write local.properties (Supabase keys from Secrets if provided)
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ADDONSTATION_SUPABASE_URL=${{ secrets.ADDONSTATION_SUPABASE_URL }}" >> local.properties
          echo "ADDONSTATION_SUPABASE_ANON_KEY=${{ secrets.ADDONSTATION_SUPABASE_ANON_KEY }}" >> local.properties

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: addonstation-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
