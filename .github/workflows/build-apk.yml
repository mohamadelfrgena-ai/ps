# بناء APK تلقائياً على GitHub — شغّله يدوياً من تبويب Actions
# (لا يحتاج أي جهاز محلي، ويقرأ مفاتيح Supabase من Secrets إن وُجدت)
#
# ملاحظات الإصلاح (2026-09-29):
#   • غلاف Gradle أصبح مرفقاً في المودع (android/gradlew + gradle/wrapper) →
#     لا حاجة لتنصيب Gradle ولا لتشغيل `gradle wrapper` بعد الآن.
#   • تم تحديث إصدار إجراء Android SDK من v3 إلى v4 (v3 لم يعد يعمل على
#     صور التشغيل الحالية — كان السبب في فشل كل البناءات السابقة).

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, arena/01a0e97c-ps ]
  pull_request:
    branches: [ main ]

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: التحقق من غلاف Gradle
        working-directory: android
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar || { echo "::error::gradle-wrapper.jar مفقود"; exit 1; }
          test -f gradle/wrapper/gradle-wrapper.properties || { echo "::error::gradle-wrapper.properties مفقود"; exit 1; }
          chmod +x gradlew
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - name: Write local.properties (مفاتيح Supabase من Secrets إن وُجدت)
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "ADDONSTATION_SUPABASE_URL=${{ secrets.ADDONSTATION_SUPABASE_URL || secrets.SUPABASE_URL }}" >> local.properties
          echo "ADDONSTATION_SUPABASE_ANON_KEY=${{ secrets.ADDONSTATION_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}" >> local.properties

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: addonstation-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
