# ============================================================================
# النقل (3/3): نقل ملفات Storage (الأغلفة والأفاتار والأصول — 597 ملفاً)
#   من مشروع Supabase القديم إلى الجديد عبر واجهات REST.
#   القديم: يقرأ من أسرار المستودع (ADDONSTATION_SUPABASE_URL/SECRET_KEY).
#   الجديد: مدخلات new_project_ref + new_service_key (service_role).
#
# التشغيل: Actions ← Migrate: Copy storage files ← Run workflow
# ============================================================================
name: "Migrate: Copy storage files"

on:
  workflow_dispatch:
    inputs:
      new_project_ref:
        description: "المرجع (ref) للمشروع الجديد"
        required: true
        type: string
      new_service_key:
        description: "مفتاح service_role للمشروع الجديد (من Settings → API)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: نسخ كل الملفات
        env:
          OLD_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || 'https://jqjmkssgjdsfdojkuqzq.supabase.co' }}
          OLD_KEY: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY }}
          NEW_REF: ${{ inputs.new_project_ref }}
          NEW_KEY: ${{ inputs.new_service_key }}
        run: |
          echo "::add-mask::$OLD_KEY"
          echo "::add-mask::$NEW_KEY"
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          OLD = os.environ["OLD_URL"].rstrip("/")
          NEW = f"https://{os.environ['NEW_REF']}.supabase.co"
          OK = os.environ["OLD_KEY"]; NK = os.environ["NEW_KEY"]
          if not OK:
              print("::error::سر ADDONSTATION_SUPABASE_SECRET_KEY غير موجود في المستودع")
              sys.exit(1)

          def req(method, url, key, data=None, headers=None):
              h = {"Authorization": f"Bearer {key}", "apikey": key}
              if headers: h.update(headers)
              body = data if isinstance(data, (bytes, type(None))) else json.dumps(data).encode()
              if body is not None and "Content-Type" not in h:
                  h["Content-Type"] = "application/json"
              r = urllib.request.Request(url, data=body, headers=h, method=method)
              try:
                  with urllib.request.urlopen(r, timeout=120) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          # 1) البُرَك (buckets) على القديم
          st, body = req("GET", f"{OLD}/storage/v1/bucket", OK)
          buckets = json.loads(body or b"[]")
          if st >= 400 or not isinstance(buckets, list):
              print(f"::error::فشل جلب البُرَك من القديم: {st} {body[:300]}")
              sys.exit(1)
          print(f"البُرَك القديمة: {[b['name'] for b in buckets]}")

          # 2) إنشاؤها على الجديد (مع نفس الإعدادات العامة)
          for b in buckets:
              st, body = req("POST", f"{NEW}/storage/v1/bucket", NK, {
                  "name": b["name"], "id": b["name"],
                  "public": bool(b.get("public")), "file_size_limit": b.get("file_size_limit"),
                  "allowed_mime_types": b.get("allowed_mime_types"),
              })
              if st in (200, 201):
                  print(f"✓ بُركة {b['name']}")
              elif st == 409:
                  print(f"= بُركة {b['name']} موجودة")
              else:
                  print(f"! بُركة {b['name']}: {st} {body[:200]}")

          # 3) نسخ كل الملفات (عرض شجري لكل بُركة)
          def list_all(key, base, bucket, prefix=""):
              out, offset = [], 0
              while True:
                  st, body = req("POST", f"{base}/storage/v1/object/list/{bucket}", key,
                                 {"prefix": prefix, "limit": 100, "offset": offset, "sortBy": {"column": "name", "order": "asc"}})
                  if st >= 400:
                      print(f"! جلب {bucket}/{prefix}: {st}"); break
                  batch = json.loads(body or b"[]")
                  for it in batch:
                      name = it.get("name", "")
                      if it.get("id") is None and it.get("metadata") is None:
                          out += list_all(key, base, bucket, f"{prefix}{name}/")
                      else:
                          out.append(f"{prefix}{name}")
                  if len(batch) < 100: break
                  offset += 100
              return out

          total = copied = 0
          for b in buckets:
              files = list_all(OK, OLD, b["name"])
              print(f"## {b['name']}: {len(files)} ملفاً")
              for path in files:
                  total += 1
                  st, data = req("GET", f"{OLD}/storage/v1/object/{b['name']}/{path}", OK)
                  if st != 200:
                      print(f"  ✗ تنزيل {path}: {st}"); continue
                  st, body = req("POST", f"{NEW}/storage/v1/object/{b['name']}/{path}", NK, data,
                                 {"Content-Type": "application/octet-stream", "x-upsert": "true"})
                  if st in (200, 201):
                      copied += 1
                  else:
                      print(f"  ✗ رفع {path}: {st} {body[:120]}")
              print(f"  → اكتمل {b['name']}")
          print(f"## النتيجة: نُسخ {copied} من {total} ملفاً")
          if copied < total:
              print("::warning::بعض الملفات لم تُنسخ — راجع السجل")
          PY
