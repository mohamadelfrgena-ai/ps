name: Build Android APK
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon 2>&1 | tee build.log; then
            grep -E -A12 "^e: |What went wrong" build.log | grep -v -E "^[[:space:]]*$" | head -45 > errs.txt || true
            while IFS= read -r l; do echo "::error::${l: -300}"; done < errs.txt
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AddonStation-apk
          path: android/app/build/outputs/apk/release/*.apk
