name: Build Android APK
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon 2>&1 | tee build.log; then
            { grep -E "^e: " build.log | head -25; tail -30 build.log; } > errs.txt || true
            while IFS= read -r l; do echo "::error::${l:0:400}"; done < errs.txt
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AddonStation-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Publish APK to "latest-apk" release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk AddonStation.apk
          gh release delete latest-apk -y --cleanup-tag || true
          gh release create latest-apk AddonStation.apk --prerelease --title "AddonStation (Kotlin) - latest build" --notes "Built from ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
