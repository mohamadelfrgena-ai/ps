# ============================================================================
# النقل (2/3): استعادة كل شيء في مشروع Supabase الجديد
#   يقرأ النسخة من supabase-migration/ (يجب تشغيل migrate-dump.yml أولاً)
#   ويعيد: حسابات المستخدمين (بكلمات مرورها) + schema public كامل (جداول +
#   دوال + سياسات + بيانات).
#
# التشغيل: Actions ← Migrate: Restore to new Supabase ← Run workflow
#   المدخلات: new_project_ref (مثال: abcdefghijklmnop) + new_db_password
# ============================================================================
name: "Migrate: Restore to new Supabase"

on:
  workflow_dispatch:
    inputs:
      new_project_ref:
        description: "المرجع (ref) للمشروع الجديد — من لوحة التحكم Settings → General"
        required: true
        type: string
      new_db_password:
        description: "كلمة سر قاعدة البيانات للمشروع الجديد"
        required: true
        type: string

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: فحص النسخة
        run: |
          ls -la supabase-migration/ || { echo "::error::لا توجد نسخة — شغّل migrate-dump.yml أولاً"; exit 1; }

      - name: الاستعادة (auth ثم public)
        env:
          PGPW: ${{ inputs.new_db_password }}
          REF: ${{ inputs.new_project_ref }}
        run: |
          set -e
          echo "::add-mask::$PGPW"
          NEWURL=""
          for TRY in "postgres@$REF.db.supabase.co:5432" "postgres@$REF.supabase.co:5432" "postgres.$REF@aws-0-eu-central-1.pooler.supabase.co:6543"; do
            U="${TRY%%@*}"; H="${TRY#*@}"; HOST="${H%%:*}"; PORT="${H##*:}"
            if docker run --rm postgres:17 psql "postgresql://$U:$PGPW@$HOST:$PORT/postgres" -c "select 1" >/dev/null 2>&1; then
              NEWURL="postgresql://$U:$PGPW@$HOST:$PORT/postgres"
              echo "✓ اتصال ناجح عبر $HOST"
              break
            fi
            echo "✗ $HOST"
          done
          if [ -z "$NEWURL" ]; then
            echo "::error::فشل الاتصال بقاعدة البيانات الجديدة — تحقق من المرجع وكلمة السر"
            exit 1
          fi
          echo "## 1) حسابات المستخدمين (auth)…"
          gunzip -c supabase-migration/old-auth.sql.gz | \
            docker run --rm -i postgres:17 psql "$NEWURL" -v ON_ERROR_STOP=0 --echo-errors 2>&1 | tail -20
          echo "## 2) schema public كامل (بنية + بيانات)…"
          gunzip -c supabase-migration/old-public.sql.gz | \
            docker run --rm -i postgres:17 psql "$NEWURL" -v ON_ERROR_STOP=0 --echo-errors 2>&1 | tail -30
          echo "## 3) التحقق من الأعداد:"
          docker run --rm postgres:17 psql "$NEWURL" -Atc \
            "select table_name || ': ' || (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from public.%I', table_name), false, true, '')))[1]::text from information_schema.tables where table_schema='public' and table_type='BASE TABLE' order by 1" \
            | tee /tmp/new-counts.txt
          echo "## 4) التحقق من المستخدمين:"
          docker run --rm postgres:17 psql "$NEWURL" -Atc "select email from auth.users order by created_at"
          echo "✓ الاستعادة اكتملت"
