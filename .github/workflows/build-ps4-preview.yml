name: Build PS4 Demo PKG

on:
  workflow_dispatch:
  push:
    branches:
      - arena/2f6505fc-ps
      - arena/5622bbf6-ps
    paths:
      - 'ps4/**'
      - '!ps4/downloads/**'
      - 'ps4-addon-test/**'
      - '.github/workflows/build-ps4-preview.yml'

permissions:
  contents: write

jobs:
  build-ps4-demo:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4

      - name: Install host compiler and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl

      - name: Download OpenOrbis toolchain and SDL2
        env:
          TOOLCHAIN_URL: https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openorbis"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$TOOLCHAIN_URL" -o "$RUNNER_TEMP/openorbis-toolchain.tar.gz"
          tar -xzf "$RUNNER_TEMP/openorbis-toolchain.tar.gz" -C "$RUNNER_TEMP/openorbis"
          TOOLCHAIN_ROOT="$RUNNER_TEMP/openorbis/OpenOrbis/PS4Toolchain"
          test -d "$TOOLCHAIN_ROOT/include"
          test -x "$TOOLCHAIN_ROOT/bin/linux/create-fself"
          test -s "$TOOLCHAIN_ROOT/samples/SDL2/sce_module/libc.prx"
          test -s "$TOOLCHAIN_ROOT/samples/SDL2/sce_module/libSceFios2.prx"
          test -s "$TOOLCHAIN_ROOT/samples/SDL2/sce_sys/about/right.sprx"
          echo "OO_PS4_TOOLCHAIN=$TOOLCHAIN_ROOT" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_ROOT/bin/linux" >> "$GITHUB_PATH"
          echo "Toolchain extracted to $TOOLCHAIN_ROOT"

      - name: Build offline demo PKG (no Supabase configuration)
        run: |
          set -euo pipefail
          rm -f ps4/config.local.hpp
          make -C ps4 clean
          set +e
          make -C ps4 2>&1 | tee "$RUNNER_TEMP/ps4-build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            echo "### PS4 build failed (exit $build_status)" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 "$RUNNER_TEMP/ps4-build.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            python3 - "$RUNNER_TEMP/ps4-build.log" <<'PY'
          import re, sys
          lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          important = [line for line in lines if re.search(r"error:|fatal|undefined reference|No such file|not found|failed|make:", line, re.I)]
          if not important:
              important = lines[-12:]
          for line in important[-20:]:
              safe = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{safe}")
          PY
            exit "$build_status"
          fi
          test -s ps4/IV0000-ASTN00001_00-ADDONSTATION0000.pkg
          echo "### Offline demo PKG built" >> "$GITHUB_STEP_SUMMARY"
          echo "No Supabase URL or key is included. The app uses local fictional sample data." >> "$GITHUB_STEP_SUMMARY"
          echo "File: ps4/IV0000-ASTN00001_00-ADDONSTATION0000.pkg" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the PKG for direct download
        uses: actions/upload-artifact@v4
        with:
          name: AddonStation-PS4-Demo-PKG
          path: ps4/IV0000-ASTN00001_00-ADDONSTATION0000.pkg
          if-no-files-found: error
          retention-days: 30
        continue-on-error: true   # artifact quota must never block the real publish step

      - name: Build standalone pkg addon test PKG
        run: |
          set -euo pipefail
          make -C ps4-addon-test clean
          make -C ps4-addon-test host-test
          make -C ps4-addon-test clean
          if ! make -C ps4-addon-test 2>&1 | tee /tmp/pkg-build.log; then
            echo "::error::pkg addon test build failed"
            ( grep -E "Unhandled|   at |error:|No such|no such|not found|Error [0-9]|fatal" /tmp/pkg-build.log | grep -v -- "-Werror" | tail -n 7 | while IFS= read -r line; do
              echo "::error::E: $line"
            done ) || true
            exit 1
          fi
          test -s ps4-addon-test/pkg-addon-test.pkg
          echo "### Standalone pkg addon test built" >> "$GITHUB_STEP_SUMMARY"
          echo "File: ps4-addon-test/pkg-addon-test.pkg" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pkg addon test PKG for direct download
        uses: actions/upload-artifact@v4
        with:
          name: pkg-addon-test
          path: ps4-addon-test/pkg-addon-test.pkg
          if-no-files-found: error
          retention-days: 30
        continue-on-error: true   # artifact quota must never block the real publish step

      - name: Publish pkg-addon-test.pkg to ps4/downloads
        run: |
          set -euo pipefail
          mkdir -p ps4/downloads
          cp ps4-addon-test/pkg-addon-test.pkg ps4/downloads/pkg-addon-test.pkg
          git config user.name "AddonStation CI"
          git config user.email "ci@users.noreply.github.com"
          git add -f ps4/downloads/pkg-addon-test.pkg
          if ! git diff --cached --quiet; then
            git commit -m "Publish pkg-addon-test.pkg to ps4/downloads [skip ci]"
            # v0.36: retry with rebase — a parallel workflow (migrate report) may land first
            for i in 1 2 3 4 5; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "published"; break; fi
              echo "push raced (attempt $i) — rebasing onto the branch tip"
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
            done
          fi
