# 🔔 طبيب الإشعارات — تشغيل يدوي فقط (لا يبني شيئاً ولا يلمس .build-request)
#
# الغرض: يجيب على سؤال «لماذا لا تصل إشعاراتي؟» من هاتفك بلا حاسوب، ويفحص
# السلسلة كاملة: نسخة التطبيق المبنية (هل تحمل Firebase؟) · القاعدة (هل نُفِّذ
# 35_push_live.sql؟) · دالة الإرسال (منشورة؟) · الأجهزة المسجّلة · الطابور
# (يتحرّك أم واقف؟) · آخر ردّ من دالة الإرسال (200 · 401 · أسرار ناقصة).
#
# التشغيل: Actions → «Push doctor» → Run workflow
#   enable = false ⇒ فحص وتقرير فقط (الآمن، ابدأ به).
#   enable = true  ⇒ مع الفحص: يشغّل الطابور تلقائياً (push_live_enable)
#                    بمفتاح ADDONSTATION_PUSH_CRON_SECRET + رابط مشروعك.
#
# الأسرار (Settings → Secrets and variables → Actions):
#   ADDONSTATION_SUPABASE_URL            = https://xxxx.supabase.co
#   ADDONSTATION_SUPABASE_SECRET_KEY     = sb_secret_…
#   ADDONSTATION_PUSH_CRON_SECRET        = نفس PUSH_CRON_SECRET في أسرار دالة الإرسال
#   ADDONSTATION_FCM_SERVICE_ACCOUNT     = نصّ JSON لحساب خدمة Firebase (اختياري:
#                                          يفشل نشره تلقائياً، فيُضاف يدوياً من لوحة سوبابيز)

name: Push doctor

on:
  workflow_dispatch:
    inputs:
      enable:
        description: "true = شغّل الطابور تلقائياً (push_live_enable) بعد الفحص"
        required: true
        default: false
        type: boolean
      deploy_function:
        description: "true = انشر دالة الإرسال send-push من هذا المودع (يحتاج مفتاح FCM سرّياً)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل المودع (ومعه آخر APK مسجّل)
        uses: actions/checkout@v4

      - name: تنصيب Python
        run: python3 -V

      - name: التحقق من السرّين الأساسيين
        env:
          URL_OK: ${{ secrets.ADDONSTATION_SUPABASE_URL != '' }}
          KEY_OK: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY != '' }}
        run: |
          if [ "$URL_OK" != "true" ] || [ "$KEY_OK" != "true" ]; then
            echo "::error::أضف ADDONSTATION_SUPABASE_URL و ADDONSTATION_SUPABASE_SECRET_KEY في أسرار المودع"
            exit 1
          fi

      - name: (اختياري) نشر دالة الإرسال مع مفتاح FCM من الأسرار
        if: ${{ inputs.deploy_function }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.ADDONSTATION_PROJECT_REF }}
          FCM_SA: ${{ secrets.ADDONSTATION_FCM_SERVICE_ACCOUNT }}
          PUSH_SECRET: ${{ secrets.ADDONSTATION_PUSH_CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::نشر الدالة يحتاج SUPABASE_ACCESS_TOKEN (من supabase.com/dashboard/account/tokens) و ADDONSTATION_PROJECT_REF — أكملها ثم أعد التشغيل."
            exit 0
          fi
          curl -sS -L https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz | tar xz
          ./supabase functions deploy send-push --project-ref "$PROJECT_REF" --no-verify-jwt
          if [ -n "$FCM_SA" ] && [ -n "$PUSH_SECRET" ]; then
            ./supabase secrets set --project-ref "$PROJECT_REF" \
              FCM_SERVICE_ACCOUNT="$FCM_SA" PUSH_CRON_SECRET="$PUSH_SECRET"
          fi

      - name: (اختياري) تشغيل الطابور تلقائياً
        if: ${{ inputs.enable }}
        env:
          SUPABASE_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY }}
          PUSH_SECRET: ${{ secrets.ADDONSTATION_PUSH_CRON_SECRET }}
        run: |
          if [ -z "$PUSH_SECRET" ]; then
            echo "::warning::لا ADDONSTATION_PUSH_CRON_SECRET — نفّذ يدوياً في SQL Editor:"
            echo "select public.push_live_enable('https://<ref>.supabase.co/functions/v1/send-push','السرّ');"
            exit 0
          fi
          python3 - "$SUPABASE_URL" "$SUPABASE_SECRET_KEY" "$PUSH_SECRET" <<'PY'
          import json, sys, urllib.request
          base, key, secret = sys.argv[1].rstrip("/"), sys.argv[2], sys.argv[3]
          body = json.dumps({"p_url": f"{base}/functions/v1/send-push", "p_secret": secret}).encode()
          req = urllib.request.Request(f"{base}/rest/v1/rpc/push_live_enable", data=body, method="POST")
          req.add_header("apikey", key); req.add_header("Authorization", "Bearer " + key)
          req.add_header("Content-Type", "application/json")
          with urllib.request.urlopen(req, timeout=60) as res:
              print("push_live_enable:", res.read().decode())
          PY

      - name: تشغيل الطبيب (تقرير كامل بالعربية)
        env:
          SUPABASE_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY }}
        run: |
          python3 tools/push_doctor.py --apk apk-debug.apk | tee doctor.txt || true
          {
            echo "## طبيب الإشعارات"
            echo ""
            echo '```'
            cat doctor.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: حارس الإشعارات الحقيقية
        run: python3 tools/check_push_live.py
