# رفع أصول الواجهة (أدوات + ملصقات + أفاتار) إلى مخزن site-assets
#
# لماذا هذا الملف؟
#   الرفع يحتاج المفتاح السري (sb_secret_…)، ولا يجوز وضعه في التطبيق أبداً.
#   هذا السير عمل يرفع كل الملفات من جهة GitHub مباشرة بلا حاجة لأي حاسوب
#   ولا تثبيت Python — فقط أضف «سرّين» في GitHub ثم اضغط Run.
#
# الإعداد مرة واحدة:
#   المستودع → Settings → Secrets and variables → Actions → New repository secret
#     1) الاسم: ADDONSTATION_SUPABASE_URL          القيمة: https://xxxx.supabase.co
#     2) الاسم: ADDONSTATION_SUPABASE_SECRET_KEY   القيمة: sb_secret_xxxxxxxx
#   (مقبولة أيضاً الأسماء القديمة SUPABASE_URL و SUPABASE_SECRET_KEY)
#
# التشغيل:
#   Actions → Upload seed assets → Run workflow → اختر الوضع:
#     dry-run = تجربة بلا رفع (تتحقق من الأسماء والعدد فقط)
#     upload  = الرفع الفعلي 288 ملفاً إلى site-assets
#
# ملاحظة أمنية: المفتاح السري يُمرَّر عبر متغيّر بيئة فقط ولا يُطبع في السجل.

name: Upload seed assets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "الوضع: dry-run (تجربة) أو upload (رفع فعلي)"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - upload
      only:
        description: "قسم واحد فقط (اتركه فارغاً لكل الأقسام)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - items
          - stickers
          - profiles

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: التحقق من وجود السرّين
        env:
          S_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || secrets.SUPABASE_URL }}
          S_KEY: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$S_URL" ] || [ -z "$S_KEY" ]; then
            echo "::error::السرّان غير مضبوطين. أضف ADDONSTATION_SUPABASE_URL و ADDONSTATION_SUPABASE_SECRET_KEY في Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✓ السرّان موجودان (الرابط: ${S_URL%%/} · طول المفتاح: ${#S_KEY} حرفاً)"
          case "$S_KEY" in
            sb_secret_*|eyJ*) echo "✓ شكل المفتاح مقبول" ;;
            *) echo "::warning::المفتاح لا يبدأ بـ sb_secret_ ولا يشبه JWT — تأكد أنه المفتاح السري" ;;
          esac

      - name: عدّ الملفات المحلية
        run: |
          echo "items   : $(find seed-assets/items    -type f | wc -l)"
          echo "stickers: $(find seed-assets/stickers -type f | wc -l)"
          echo "profiles: $(find seed-assets/profiles -type f | wc -l)"
          echo "الإجمالي: $(find seed-assets -type f | wc -l) ملفاً"

      - name: تجربة بلا رفع (dry-run)
        if: ${{ inputs.mode == 'dry-run' }}
        env:
          SUPABASE_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          python3 tools/upload_seed_assets.py --dry-run ${{ inputs.only != '' && format('--only {0}', inputs.only) || '' }}

      - name: الرفع الفعلي
        if: ${{ inputs.mode == 'upload' }}
        env:
          SUPABASE_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          python3 tools/upload_seed_assets.py ${{ inputs.only != '' && format('--only {0}', inputs.only) || '' }}

      - name: تحقق بعد الرفع (رابط عام لأول ملف)
        if: ${{ inputs.mode == 'upload' }}
        env:
          S_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || secrets.SUPABASE_URL }}
        run: |
          set -e
          FILE=$(find seed-assets/items -type f | head -1)
          REL=${FILE#seed-assets/}
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "${S_URL%/}/storage/v1/object/public/site-assets/$REL")
          echo "الملف: $REL → HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            echo "✅ الأصول تعمل — ستظهر الصور في التطبيق"
          else
            echo "::warning::الملف لم يُقرأ عامّاً (HTTP $CODE) — تأكد أن مخزن site-assets عام (public) وأن 05_storage.sql نُفِّذ"
          fi
