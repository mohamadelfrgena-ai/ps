# ============================================================================
# النقل (1/3): استخراج كامل من مشروع Supabase القديم
#   يعمل عبر pg_dump من داخل GitHub Actions (اتصال مباشر بكلمة سر المشروع).
#   المخرجات تُسجَّل في supabase-migration/ داخل المستودع:
#     old-public.sql.gz  → بنية + بيانات schema public (الجداول والدوال والسياسات)
#     old-auth.sql.gz    → حسابات المستخدمين + هوياتهم (كلمات المرور كما هي)
#   ملفات Storage تُنقل بسير العمل migrate-storage.yml (3/3).
#
# التشغيل: Actions ← Migrate: Dump old Supabase ← Run workflow ← كلمة السر
# (كلمة السر تُقنَّع فوراً ولا تُحفظ في المستودع)
# ============================================================================
name: "Migrate: Dump old Supabase"

on:
  workflow_dispatch:
    inputs:
      old_db_password:
        description: "كلمة سر قاعدة البيانات للمشروع القديم"
        required: true
        type: string

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pg_dump (public + auth)
        env:
          PGPW: ${{ inputs.old_db_password }}
        run: |
          set -e
          echo "::add-mask::$PGPW"
          REF="jqjmkssgjdsfdojkuqzq"
          PGURL=""
          # الاتصال المباشر أولاً، ثم الـ pooler (eu-central-1)
          for TRY in "postgres@db.$REF.supabase.co:5432" "postgres.$REF@aws-0-eu-central-1.pooler.supabase.co:6543"; do
            U="${TRY%%@*}"; H="${TRY#*@}"; HOST="${H%%:*}"; PORT="${H##*:}"
            if docker run --rm postgres:17 psql "postgresql://$U:$PGPW@$HOST:$PORT/postgres" -c "select 1" >/dev/null 2>&1; then
              PGURL="postgresql://$U:$PGPW@$HOST:$PORT/postgres"
              echo "✓ اتصال ناجح عبر $HOST"
              break
            fi
            echo "✗ $HOST"
          done
          if [ -z "$PGURL" ]; then
            echo "::error::فشل الاتصال بقاعدة البيانات القديمة — تحقق من كلمة السر"
            exit 1
          fi
          mkdir -p supabase-migration
          echo "## استخراج schema public (بنية + بيانات)…"
          docker run --rm postgres:17 pg_dump "$PGURL" \
            --schema=public --no-owner --no-acl \
            | gzip > supabase-migration/old-public.sql.gz
          echo "## استخراج حسابات المستخدمين (auth)…"
          docker run --rm postgres:17 pg_dump "$PGURL" \
            --data-only --no-owner --no-acl \
            --table=auth.users --table=auth.identities \
            | gzip > supabase-migration/old-auth.sql.gz
          ls -la supabase-migration/
          echo "## أحجام الجداول المستخرجة:"
          docker run --rm postgres:17 psql "$PGURL" -Atc \
            "select table_name || ': ' || (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from public.%I', table_name), false, true, '')))[1]::text from information_schema.tables where table_schema='public' and table_type='BASE TABLE' order by 1" \
            | tee supabase-migration/table-counts.txt

      - name: تسجيل النسخة في المستودع
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase-migration/
          if git diff --cached --quiet; then
            echo "لا تغيير"
          else
            git commit -m "Supabase migration dump: public + auth [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
