# رفع **أغلفة الملف الشخصي (البانرات)** من ملف المالك Banner.zip
#
# ما يفعله بالترتيب:
#   1) ينزّل Banner.zip من المستودع العام mohamadelfrgena-ai/vae
#   2) يرفع الصور إلى مخزن site-assets تحت banners/nature وbanners/random
#   3) يسجّلها في site_assets عبر REST (بلا لصق SQL):
#        40 غلافاً · required_plan = epic ⇒ مقفولة 🔒 إلا باشتراك
#        قسمان (فقرتان): Nature 🌿 و Random 🎲
#        animated = true لكل ملف gif ⇒ يتحرّك في المعاينة والاستخدام
#   4) يتحقق بقراءة الصفوف من قاعدة البيانات ويطبع الأعداد
#
# الإعداد المطلوب مرة واحدة (نفس سرّي رفع الأصول):
#   Settings → Secrets and variables → Actions:
#     ADDONSTATION_SUPABASE_URL          = https://xxxx.supabase.co
#     ADDONSTATION_SUPABASE_SECRET_KEY   = sb_secret_xxxxxxxx
#
# التشغيل: Actions → Upload profile banners → Run workflow
#   (mode = dry-run للتجربة · upload للرفع والتسجيل الفعلي)

name: Upload profile banners

on:
  # دفعُ ملف `.upload-request` يشغّل السير تلقائياً (نفس أسلوب `.build-request`)
  push:
    branches: [ main, arena/01a0e97c-ps, arena/01a10743-ps ]
    paths:
      - '.upload-request'
  workflow_dispatch:
    inputs:
      mode:
        description: "الوضع: dry-run (تجربة) أو upload (رفع + تسجيل)"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - upload
      zip_url:
        description: "رابط ملف الأغلفة Banner.zip"
        required: true
        default: "https://raw.githubusercontent.com/mohamadelfrgena-ai/vae/main/Banner.zip"

jobs:
  upload-banners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # الوضع والرابط: من مُدخلات التشغيل اليدوي، وإلا من ملف `.upload-request`
      - name: قراءة الطلب
        id: req
        run: |
          MODE="${{ inputs.mode }}"
          ZIP="${{ inputs.zip_url }}"
          if [ -f .upload-request ]; then
            m=$(grep -E '^mode:' .upload-request | head -1 | sed 's/^mode://' | tr -d ' \r')
            z=$(grep -E '^zip:' .upload-request | head -1 | sed 's/^zip://' | tr -d ' \r')
            [ -n "$m" ] && MODE="$m"
            [ -n "$z" ] && ZIP="$z"
          fi
          [ -z "$MODE" ] && MODE="dry-run"
          [ -z "$ZIP" ] && ZIP="https://raw.githubusercontent.com/mohamadelfrgena-ai/vae/main/Banner.zip"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "⟹ الوضع: $MODE · الأرشيف: $ZIP"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: التحقق من وجود السرّين
        env:
          S_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || secrets.SUPABASE_URL }}
          S_KEY: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$S_URL" ] || [ -z "$S_KEY" ]; then
            echo "::error::السرّان غير مضبوطين. أضف ADDONSTATION_SUPABASE_URL و ADDONSTATION_SUPABASE_SECRET_KEY في Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✓ السرّان موجودان (الرابط: ${S_URL%%/} · طول المفتاح: ${#S_KEY} حرفاً)"

      - name: تنزيل Banner.zip
        run: |
          set -e
          curl -fsSL -o Banner.zip "${{ steps.req.outputs.zip }}"
          ls -lh Banner.zip
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("Banner.zip")
          names = [n for n in z.namelist() if not n.endswith("/")]
          folders = sorted({n.split("/")[-2] for n in names if "/" in n})
          gifs = [n for n in names if n.lower().endswith(".gif")]
          print("المجلدات (الفقرات):", folders)
          print("عدد الصور:", len(names), "· متحرّكة gif:", len(gifs))
          assert names, "الأرشيف فارغ"
          PY

      - name: تجربة بلا رفع (dry-run)
        if: ${{ steps.req.outputs.mode == 'dry-run' }}
        env:
          SUPABASE_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          python3 tools/upload_banners.py --zip Banner.zip --dry-run

      - name: الرفع + التسجيل في القاعدة
        if: ${{ steps.req.outputs.mode == 'upload' }}
        env:
          SUPABASE_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          python3 tools/upload_banners.py --zip Banner.zip --seed

      - name: "تحقق: رابط عام لأول غلاف"
        if: ${{ steps.req.outputs.mode == 'upload' }}
        env:
          S_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || secrets.SUPABASE_URL }}
        run: |
          set -e
          python3 - <<'PY' > /tmp/first_banner.txt
          import re, io
          sql = io.open("supabase/21_banners.sql", encoding="utf-8").read()
          print(re.search(r"'banners/[a-z0-9._/-]+'", sql).group(0).strip("'"))
          PY
          REL=$(cat /tmp/first_banner.txt)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "${S_URL%/}/storage/v1/object/public/site-assets/$REL")
          echo "$REL → HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::warning::الغلاف لا يُقرأ عامّاً — تأكد أن مخزن site-assets عام وأن 05_storage.sql نُفِّذ"
          else
            echo "✅ الأغلفة تعمل — افتح التطبيق: الملف الشخصي ← تعديل ← تبويب «الأغلفة 🔒»"
          fi
