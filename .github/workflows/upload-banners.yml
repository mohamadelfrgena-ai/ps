# نشر حزمة البانرات الجديدة وحزمة التحقق المطلوبة بأمان.
#
# ما يفعله بالترتيب:
#   1) ينزّل banner.zip وحزمة verification من مستودع المالك.
#   2) يستخرج الأرشيفين مع منع path traversal والروابط الرمزية.
#   3) يتحقق من قائمة الملفات والأحجام وSHA-256 ثم يرفع 56 أصلاً.
#   4) ينقل أصول الأدمن القديمة إلى المخزن الخاص ويحذف النسخ العامة.
#   5) يحذف ملفات Nature القديمة ويتحقق من الملفات البعيدة ويُخرج سجلاً.
#
# تسجيل كتالوج الأصول وصلاحيات creator/admin يتم عبر migration 48.
#
# الإعداد المطلوب مرة واحدة (نفس سرّي رفع الأصول):
#   Settings → Secrets and variables → Actions:
#     ADDONSTATION_SUPABASE_URL          = https://xxxx.supabase.co
#     ADDONSTATION_SUPABASE_SECRET_KEY   = sb_secret_xxxxxxxx
#
# التشغيل: Actions → Upload profile banners → Run workflow
#   (mode = dry-run للتجربة · upload للرفع والتسجيل الفعلي)

name: Upload requested profile assets

on:
  # دفعُ ملف `.upload-request` يشغّل السير تلقائياً (نفس أسلوب `.build-request`)
  push:
    branches: [ main, arena/01a0e97c-ps, arena/01a10743-ps, arena/75fb0e28-ps ]
    paths:
      - '.upload-request'
  workflow_dispatch:
    inputs:
      mode:
        description: "الوضع: dry-run (تجربة) أو upload (رفع + تسجيل)"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - upload
      zip_url:
        description: "رابط ملف الأغلفة Banner.zip"
        required: true
        default: "https://raw.githubusercontent.com/mohamadelfrgena-ai/vae/main/Banner.zip"

jobs:
  upload-banners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # الوضع والرابط: من مُدخلات التشغيل اليدوي، وإلا من ملف `.upload-request`
      - name: قراءة الطلب
        id: req
        run: |
          MODE="${{ inputs.mode }}"
          ZIP="${{ inputs.zip_url }}"
          if [ -f .upload-request ]; then
            m=$(grep -E '^mode:' .upload-request | head -1 | sed 's/^mode://' | tr -d ' \r')
            z=$(grep -E '^zip:' .upload-request | head -1 | sed 's/^zip://' | tr -d ' \r')
            [ -n "$m" ] && MODE="$m"
            [ -n "$z" ] && ZIP="$z"
          fi
          [ -z "$MODE" ] && MODE="dry-run"
          [ -z "$ZIP" ] && ZIP="https://raw.githubusercontent.com/mohamadelfrgena-ai/vae/main/Banner.zip"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "⟹ الوضع: $MODE · الأرشيف: $ZIP"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: التحقق من وجود السرّين
        env:
          S_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || secrets.SUPABASE_URL }}
          S_KEY: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$S_URL" ] || [ -z "$S_KEY" ]; then
            echo "::error::السرّان غير مضبوطين. أضف ADDONSTATION_SUPABASE_URL و ADDONSTATION_SUPABASE_SECRET_KEY في Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✓ السرّان موجودان (الرابط: ${S_URL%%/} · طول المفتاح: ${#S_KEY} حرفاً)"

      - name: تنزيل Banner.zip والتحقق من نوع الحزمة
        id: package
        run: |
          set -e
          curl -fsSL -o Banner.zip "${{ steps.req.outputs.zip }}"
          ls -lh Banner.zip
          python3 - <<'PY'
          import os, zipfile
          z = zipfile.ZipFile("Banner.zip")
          names = [n for n in z.namelist() if not n.endswith("/")]
          folders = sorted({n.split("/")[-2] for n in names if "/" in n})
          gifs = [n for n in names if n.lower().endswith(".gif")]
          requested = any(n.endswith("06aa4e3ff6eab5eecad52378a694114a.jpg") for n in names)
          print("المجلدات (الفقرات):", folders)
          print("عدد الصور:", len(names), "· متحرّكة gif:", len(gifs), "· الحزمة الجديدة:", requested)
          assert names, "الأرشيف فارغ"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"requested={'true' if requested else 'false'}\n")
          PY

      - name: تنزيل حزمة verification واستخراج الحزمتين بأمان
        if: ${{ steps.package.outputs.requested == 'true' }}
        run: |
          set -e
          curl -fsSL -o verification.zip \
            "https://raw.githubusercontent.com/mohamadelfrgena-ai/vae/main/45945-verification-emojigg-pack.zip"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          def safe_extract(archive, destination):
              root = Path(destination).resolve()
              root.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as zf:
                  for info in zf.infolist():
                      target = (root / info.filename).resolve()
                      if root not in target.parents and target != root:
                          raise SystemExit(f"unsafe archive member: {info.filename}")
                      unix_mode = info.external_attr >> 16
                      if (unix_mode & 0o170000) == 0o120000:
                          raise SystemExit(f"symbolic links are not allowed: {info.filename}")
                  zf.extractall(root)

          safe_extract("Banner.zip", "/tmp/requested/banner")
          safe_extract("verification.zip", "/tmp/requested/verification")
          PY
          find /tmp/requested -type f -printf '%P\n' | sort

      - name: تنزيل أغلفة الأدمن من مستودع المالك
        if: ${{ steps.req.outputs.mode == 'admin-gifs' }}
        run: |
          set -e
          # المجلد الداخلي اسمه Admin ⇒ يصير القسم «Admin 👑» والمسار banners/admin/
          mkdir -p AdminAssets/Admin
          curl -fsSL -o "AdminAssets/Admin/downloa1d.gif" \
               "https://raw.githubusercontent.com/mohamadelfrgena-ai/vae/main/downloa1d.gif"
          curl -fsSL -o "AdminAssets/Admin/Animation Reference.gif" \
               "https://raw.githubusercontent.com/mohamadelfrgena-ai/vae/main/Animation%20Reference.gif"
          ls -lh AdminAssets/Admin

      - name: رفع أغلفة الأدمن + تسجيلها (admin فقط)
        if: ${{ steps.req.outputs.mode == 'admin-gifs' }}
        env:
          SUPABASE_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -o pipefail
          exec > >(tee "$GITHUB_WORKSPACE/upload-log.txt") 2>&1
          python3 -m pip install --quiet pillow
          python3 tools/upload_banners.py --dir ./AdminAssets --plan admin --seed --sql /tmp/admin_banners.sql

      - name: التسجيل فقط (الصور مرفوعة سابقاً)
        if: ${{ steps.req.outputs.mode == 'seed-only' }}
        env:
          SUPABASE_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -o pipefail
          exec > >(tee "$GITHUB_WORKSPACE/upload-log.txt") 2>&1
          python3 tools/upload_banners.py --zip Banner.zip --seed-only

      - name: تجربة بلا رفع (dry-run)
        if: ${{ steps.req.outputs.mode == 'dry-run' }}
        env:
          SUPABASE_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          python3 tools/upload_banners.py --zip Banner.zip --dry-run

      - name: الرفع + التسجيل في القاعدة
        if: ${{ steps.req.outputs.mode == 'upload' }}
        env:
          SUPABASE_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/upload-log.txt") 2>&1
          if [ "${{ steps.package.outputs.requested }}" = "true" ]; then
            BANNER_DIR="$(find /tmp/requested/banner -type f -name '06aa4e3ff6eab5eecad52378a694114a.jpg' -printf '%h\n' | head -1)"
            test -n "$BANNER_DIR"
            python3 tools/deploy_requested_profile_assets.py \
              --banner-dir "$BANNER_DIR" \
              --verification-dir /tmp/requested/verification \
              --apply
            # Migration 40 changed existing admin catalog paths before their
            # bytes had been copied. Finish that pending migration and remove
            # every legacy public admin copy. The two new admin files were
            # uploaded directly to admin-assets by the command above.
            set +e
            python3 tools/migrate_admin_assets_private.py --apply
            MIGRATE_STATUS=$?
            set -e
            if [ "$MIGRATE_STATUS" -ne 0 ]; then
              SUMMARY=$(grep -E '✗|  - .*HTTP' "$GITHUB_WORKSPACE/upload-log.txt" | tail -8 | tr '\n' ';' | sed 's/%/%25/g')
              echo "::error title=Admin asset migration::${SUMMARY:-See upload step output}"
              exit "$MIGRATE_STATUS"
            fi
          else
            python3 -m pip install --quiet pillow
            python3 tools/upload_banners.py --zip Banner.zip --seed
          fi

      - name: تطبيق migration 48 لكتالوج الأصول والصلاحيات
        if: ${{ steps.req.outputs.mode == 'upload' && steps.package.outputs.requested == 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || secrets.SUPABASE_URL }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          token = os.environ.get("SUPABASE_ACCESS_TOKEN", "")
          base = os.environ.get("SUPABASE_URL", "")
          if not token:
              print("::error title=Migration 48::SUPABASE_ACCESS_TOKEN is not configured")
              raise SystemExit(1)
          ref = base.split("//", 1)[-1].split(".", 1)[0]
          query = open("supabase/48_creator_verification_and_featured_banners.sql", encoding="utf-8").read()
          request = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{ref}/database/query",
              data=json.dumps({"query": query}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  response.read()
                  print(f"Migration 48 applied to {ref} (HTTP {response.status})")
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", "replace")[:700].replace("%", "%25").replace("\n", " ")
              print(f"::error title=Migration 48::HTTP {error.code}: {detail}")
              raise SystemExit(1)
          PY

      - name: "تحقق: رابط عام لأول غلاف"
        if: ${{ steps.req.outputs.mode == 'upload' || steps.req.outputs.mode == 'seed-only' || steps.req.outputs.mode == 'admin-gifs' }}
        env:
          S_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || secrets.SUPABASE_URL }}
        run: |
          set -e
          if [ "${{ steps.package.outputs.requested }}" = "true" ]; then
            REL="banners/featured/06aa4e3ff6eab5eecad52378a694114a.jpg"
          else
            python3 - <<'PY' > /tmp/first_banner.txt
          import re, io
          sql = io.open("supabase/21_banners.sql", encoding="utf-8").read()
          print(re.search(r"'banners/[a-z0-9._/-]+'", sql).group(0).strip("'"))
          PY
            REL=$(cat /tmp/first_banner.txt)
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "${S_URL%/}/storage/v1/object/public/site-assets/$REL")
          echo "$REL → HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::الغلاف لا يُقرأ عامّاً — تأكد أن مخزن site-assets عام وأن 05_storage.sql نُفِّذ"
            exit 1
          else
            echo "✅ الأغلفة تعمل — افتح التطبيق: الملف الشخصي ← تعديل ← تبويب الأغلفة"
          fi

      # ── شعار AddonStation لقوالب البريد ────────────────────────────────
      # قوالب بريد Supabase تحتاج رابطاً عاماً للصورة (لا تقبل الصور المضمّنة)،
      # فنرفع الشعار إلى site-assets/brand/ ونستخدم رابطه في القوالب.
      - name: رفع شعار AddonStation (mode = brand)
        if: ${{ steps.req.outputs.mode == 'brand' }}
        env:
          SUPABASE_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -o pipefail
          exec > >(tee "$GITHUB_WORKSPACE/upload-log.txt") 2>&1
          python3 tools/upload_brand.py --dir ./brand
          echo ""
          echo "استخدم هذا الرابط في حقل الصورة داخل قوالب البريد (docs/07-EMAIL-BRANDING-AR.md)"

      - name: حفظ سجل الرفع كمخرج للتشغيل
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: profile-assets-upload-log-${{ github.run_id }}
          path: upload-log.txt
          if-no-files-found: ignore
          retention-days: 7
