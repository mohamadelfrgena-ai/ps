# ============================================================================
# نقل Supabase الكامل: القديم (jqjmkssgjdsfdojkuqzq) ← الجديد (stbmescmexzcszyyambq)
#
# يعمل بملف الطلب .migrate-request (task: all/dump/restore/storage).
#
# المسار لا يحتاج كلمة السر القديمة إطلاقاً:
#   1) dump     — استخراج كل الجداول عبر REST (service key من أسرار المستودع)
#                + محاولة pg_dump إضافية إن كانت كلمة السر صحيحة (اختياري)
#   2) restore  — بناء البنية (ملفات supabase/*.sql) + حسابات المستخدمين
#                (old-auth.sql — بكلمات مرورها) + البيانات الحقيقية
#   3) storage  — نسخ كل ملفات التخزين
#
# الأسرار: NEW_DB_PASSWORD (للس الجديد) + NEW_SERVICE_KEY (لرفع الملفات)
#          ADDONSTATION_SUPABASE_SECRET_KEY (لقراءة القديم — موجود مسبقاً)
# ============================================================================
name: "Migrate: Supabase old → new"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "all (كل المراحل) · dump · restore · storage"
        required: true
        default: all
        type: choice
        options: [all, dump, restore, storage]
  push:
    branches: [ main, arena/5622bbf6-ps ]
    paths:
      - '.migrate-request'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: قراءة المهمة
        id: cfg
        env:
          IN_TASK: ${{ inputs.task }}
          SEC_OLD_PW: ${{ secrets.OLD_DB_PASSWORD }}
          SEC_NEW_PW: ${{ secrets.NEW_DB_PASSWORD }}
          SEC_NEW_SK: ${{ secrets.NEW_SERVICE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK="${IN_TASK:-all}"
          else
            TASK=$(sed -n 's/^[[:space:]]*task:[[:space:]]*//p' .migrate-request | tr -d '"' | tr -d '[:space:]' | head -1)
            [ -z "$TASK" ] && TASK="all"
          fi
          {
            echo "task=$TASK"
            echo "old_pw=$SEC_OLD_PW"
            echo "new_pw=$SEC_NEW_PW"
            echo "new_sk=$SEC_NEW_SK"
            echo "new_ref=stbmescmexzcszyyambq"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=المهمة::task=$TASK"

      # ---------------------------------------------------------------- Stage 1
      - name: "المرحلة 1: الاستخراج (REST بلا كلمة سر)"
        if: steps.cfg.outputs.task == 'all' || steps.cfg.outputs.task == 'dump'
        env:
          OLD_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || 'https://jqjmkssgjdsfdojkuqzq.supabase.co' }}
          OLD_KEY: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY }}
          PGPW: ${{ steps.cfg.outputs.old_pw }}
        run: |
          set +e
          echo "::add-mask::$OLD_KEY"
          echo "::add-mask::$PGPW"
          mkdir -p supabase-migration
          # 1) الاستخراج الأساسي عبر REST (service key) — لا يحتاج كلمة السر
          python3 tools/migrate_rest_dump.py "$OLD_URL" "$OLD_KEY" supabase-migration
          RC=$?
          if [ "$RC" != "0" ]; then
            echo "::error title=الاستخراج::فشل استخراج REST"
            exit 1
          fi
          # 2) محاولة pg_dump إضافية (اختيارية — تنجح فقط لو كانت كلمة السر صحيحة)
          if [ -n "$PGPW" ]; then
            FOUND=$(python3 tools/find_pg_host.py jqjmkssgjdsfdojkuqzq "$PGPW" eu-central-1 2>>/tmp/find1.err | tail -1)
            if [ "$FOUND" != "${FOUND#OK }" ]; then
              CH=$(echo "$FOUND" | cut -d" " -f2); CP=$(echo "$FOUND" | cut -d" " -f3); CU=$(echo "$FOUND" | cut -d" " -f4)
              docker run --rm -e PGPASSWORD="$PGPW" postgres:17 \
                pg_dump -h "$CH" -p "$CP" -U "$CU" -d postgres --schema=public --no-owner --no-acl \
                | gzip > supabase-migration/old-public.sql.gz
              echo "::notice title=pg_dump::أُضيفت نسخة كاملة من البنية القديمة"
            else
              echo "::notice title=pg_dump::تخطّي (كلمة السر القديمة غير صالحة — لا نحتاجها)"
            fi
            cat /tmp/find1.err
          fi
          ls -la supabase-migration/ | sed 's/^/::notice title=الملفات::/'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase-migration/
          if git diff --cached --quiet; then
            echo "لا تغيير"
          else
            git commit -m "Supabase migration dump (REST + auth) [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      # ---------------------------------------------------------------- Stage 2
      - name: "المرحلة 2: الاستعادة في الجديد (بنية + حسابات + بيانات)"
        if: steps.cfg.outputs.task == 'all' || steps.cfg.outputs.task == 'restore'
        env:
          PGPW: ${{ steps.cfg.outputs.new_pw }}
          REF: ${{ steps.cfg.outputs.new_ref }}
        run: |
          set +e
          echo "::add-mask::$PGPW"
          if [ -z "$PGPW" ]; then echo "::error title=الاستعادة::سر NEW_DB_PASSWORD مفقود"; exit 1; fi
          if [ ! -f supabase-migration/rest-data.sql ]; then
            echo "::error title=الاستعادة::لا توجد بيانات مستخرجة — المرحلة 1 لم تنجح"
            exit 1
          fi
          FOUND=$(python3 tools/find_pg_host.py "$REF" "$PGPW" 2>>/tmp/find2.err | tail -1)
          cat /tmp/find2.err
          if [ "$FOUND" = "${FOUND#OK }" ]; then
            echo "::error title=الاستعادة::فشل اكتشاف اتصال المشروع الجديد (التفاصيل أعلاه)"
            exit 1
          fi
          CH=$(echo "$FOUND" | cut -d" " -f2); CP=$(echo "$FOUND" | cut -d" " -f3); CU=$(echo "$FOUND" | cut -d" " -f4)
          SQL() {
            docker run --rm -i -e PGPASSWORD="$PGPW" postgres:17 \
              psql -h "$CH" -p "$CP" -U "$CU" -d postgres -v ON_ERROR_STOP=0 "$@"
          }
          echo "::notice title=1/5::بناء البنية من ملفات supabase/*.sql…"
          for f in supabase/*.sql; do
            [ "$f" = "supabase-migration/old-auth.sql" ] && continue
            gunzip -c "$f" 2>/dev/null > /tmp/one.sql || cp "$f" /tmp/one.sql
            SQL -q -f /tmp/one.sql >/dev/null 2>>/tmp/schema.err
          done
          ERRS=$(grep -c "^ERROR" /tmp/schema.err 2>/dev/null || echo 0)
          echo "::notice title=البنية::انتهت بـ $ERRS تحذيراً (متوقع في التكرار)"
          echo "::notice title=2/5::حسابات المستخدمين (بكلمات مرورها)…"
          SQL -f supabase-migration/old-auth.sql 2>&1 | grep -E "^(ERROR|INSERT|BEGIN|COMMIT)" | sed 's/^/::notice title=auth::/' | head -8
          echo "::notice title=3/5::تفريغ بيانات الـ seed…"
          SQL -f supabase-migration/truncate.sql >/dev/null 2>&1
          echo "::notice title=4/5::إدراج البيانات الحقيقية…"
          SQL -f supabase-migration/rest-data.sql >/dev/null 2>>/tmp/data.err
          DERRS=$(grep -c "^ERROR" /tmp/data.err 2>/dev/null || echo 0)
          if [ "$DERRS" != "0" ]; then
            grep "^ERROR" /tmp/data.err | head -8 | sed 's/^/::warning title=بيانات::/'
          fi
          echo "::notice title=5/5::تسلسل الأرقام + التحقق…"
          SQL -c "do \$\$ declare r record; begin for r in select table_name, column_name from information_schema.columns where table_schema='public' and column_default like 'nextval%' loop execute format('select setval(pg_get_serial_sequence(%L,%L), coalesce((select max(%I) from public.%I), 1))', r.table_name, r.column_name, r.column_name, r.table_name); end loop; end \$\$;" >/dev/null 2>&1
          COUNTS=$(SQL -Atc "select table_name || '=' || (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from public.%I', table_name), false, true, '')))[1]::text from information_schema.tables where table_schema='public' and table_type='BASE TABLE' order by 1")
          echo "::notice title=جداول الجديد::$(echo "$COUNTS" | tr '\n' ' ' | head -c 800)"
          USERS=$(SQL -Atc "select string_agg(email, ', ') from auth.users")
          echo "::notice title=المستخدمون::$USERS"

      # ---------------------------------------------------------------- Stage 3
      - name: "المرحلة 3: نسخ ملفات Storage"
        if: steps.cfg.outputs.task == 'all' || steps.cfg.outputs.task == 'storage'
        env:
          OLD_URL: ${{ secrets.ADDONSTATION_SUPABASE_URL || 'https://jqjmkssgjdsfdojkuqzq.supabase.co' }}
          OLD_KEY: ${{ secrets.ADDONSTATION_SUPABASE_SECRET_KEY }}
          NEW_REF: ${{ steps.cfg.outputs.new_ref }}
          NEW_KEY: ${{ steps.cfg.outputs.new_sk }}
        run: |
          set +e
          echo "::add-mask::$OLD_KEY"
          echo "::add-mask::$NEW_KEY"
          if [ -z "$OLD_KEY" ]; then echo "::error title=التخزين::سر ADDONSTATION_SUPABASE_SECRET_KEY مفقود"; exit 1; fi
          if [ -z "$NEW_KEY" ]; then echo "::error title=التخزين::مفتاح NEW_SERVICE_KEY مفقود"; exit 1; fi
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          OLD = os.environ["OLD_URL"].rstrip("/")
          NEW = f"https://{os.environ['NEW_REF']}.supabase.co"
          OK = os.environ["OLD_KEY"]; NK = os.environ["NEW_KEY"]

          def note(t, m): print(f"::notice title={t}::{m}")
          def req(method, url, key, data=None, headers=None):
              h = {"Authorization": f"Bearer {key}", "apikey": key}
              if headers: h.update(headers)
              body = data if isinstance(data, (bytes, type(None))) else json.dumps(data).encode()
              if body is not None and "Content-Type" not in h:
                  h["Content-Type"] = "application/json"
              r = urllib.request.Request(url, data=body, headers=h, method=method)
              try:
                  with urllib.request.urlopen(r, timeout=180) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()

          st, body = req("GET", f"{OLD}/storage/v1/bucket", OK)
          buckets = json.loads(body or b"[]")
          if st >= 400 or not isinstance(buckets, list):
              print(f"::error title=التخزين::فشل جلب البُرَك: {st} {body[:200]}"); sys.exit(1)
          note("البُرَك", ", ".join(b["name"] for b in buckets))

          for b in buckets:
              st2, body2 = req("POST", f"{NEW}/storage/v1/bucket", NK, {
                  "name": b["name"], "id": b["name"],
                  "public": bool(b.get("public")),
                  "file_size_limit": b.get("file_size_limit"),
                  "allowed_mime_types": b.get("allowed_mime_types"),
              })
              state = "أنشئت" if st2 in (200, 201) else "موجودة" if st2 == 409 else f"خطأ {st2} {body2[:120]}"
              note(f"بُركة {b['name']}", state)

          def list_all(key, base, bucket, prefix=""):
              out, offset = [], 0
              while True:
                  st3, body3 = req("POST", f"{base}/storage/v1/object/list/{bucket}", key,
                                   {"prefix": prefix, "limit": 100, "offset": offset,
                                    "sortBy": {"column": "name", "order": "asc"}})
                  if st3 >= 400:
                      note("خطأ جلب", f"{bucket}/{prefix}: {st3}"); break
                  batch = json.loads(body3 or b"[]")
                  for it in batch:
                      name = it.get("name", "")
                      if it.get("id") is None and it.get("metadata") is None:
                          out += list_all(key, base, bucket, f"{prefix}{name}/")
                      else:
                          out.append(f"{prefix}{name}")
                  if len(batch) < 100: break
                  offset += 100
              return out

          MIME = {"jpg": "image/jpeg", "jpeg": "image/jpeg", "png": "image/png",
                  "gif": "image/gif", "webp": "image/webp", "mp4": "video/mp4",
                  "mp3": "audio/mpeg", "wav": "audio/wav", "json": "application/json",
                  "pdf": "application/pdf", "mcaddon": "application/octet-stream"}

          def tus_upload(url_base, key, bucket, path, data, ctype):
              import base64
              md = ",".join(
                  f"{k} {base64.b64encode(v.encode()).decode()}"
                  for k, v in (("bucketName", bucket), ("objectName", path), ("contentType", ctype)).items() if v
              )
              r = urllib.request.Request(f"{url_base}/storage/v1/upload/resumable", method="POST", headers={
                  "Authorization": f"Bearer {key}", "apikey": key,
                  "Tus-Resumable": "1.0.0", "Upload-Length": str(len(data)),
                  "Upload-Metadata": md, "x-upsert": "true",
              })
              with urllib.request.urlopen(r, timeout=120) as resp:
                  loc = resp.headers.get("Location", "")
              if loc.startswith("/"):
                  loc = url_base + loc
              offset = 0
              while offset < len(data):
                  chunk = data[offset:offset + 6 * 1024 * 1024]
                  r2 = urllib.request.Request(loc, method="PATCH", data=chunk, headers={
                      "Authorization": f"Bearer {key}", "apikey": key,
                      "Tus-Resumable": "1.0.0", "Upload-Offset": str(offset),
                      "Content-Type": "application/offset+octet-stream",
                  })
                  with urllib.request.urlopen(r2, timeout=300) as resp2:
                      if resp2.status not in (200, 204):
                          return resp2.status
                  offset += len(chunk)
              return 200

          total = copied = 0
          for b in buckets:
              files = list_all(OK, OLD, b["name"])
              note(f"ملفات {b['name']}", f"{len(files)} ملفاً")
              for path in files:
                  total += 1
                  q = urllib.request.quote(path, safe="/")
                  st4, data = req("GET", f"{OLD}/storage/v1/object/{b['name']}/{q}", OK)
                  if st4 != 200:
                      note("فشل تنزيل", f"{path}: {st4}"); continue
                  ctype = MIME.get(path.rsplit(".", 1)[-1].lower(), "application/octet-stream")
                  if len(data) > 4 * 1024 * 1024:
                      try:
                          st5 = tus_upload(NEW, NK, b["name"], path, data, ctype)
                          body5 = b""
                      except Exception as ex:  # noqa: BLE001
                          st5, body5 = 0, str(ex).encode()
                  else:
                      st5, body5 = req("POST", f"{NEW}/storage/v1/object/{b['name']}/{q}", NK, data,
                                       {"Content-Type": ctype, "x-upsert": "true"})
                  if st5 in (200, 201):
                      copied += 1
                  else:
                      note("فشل رفع", f"{path}: {st5} {body5[:100]}")
          note("النتيجة", f"نُسخ {copied} من {total} ملفاً")
          if copied < total:
              print(f"::warning title=التخزين::لم تُنسخ {total - copied} ملفات")
          PY

      # ------------------------------------------------------- Final verify
      - name: "التحقق النهائي من القاعدة"
        if: steps.cfg.outputs.task == 'all' || steps.cfg.outputs.task == 'restore'
        env:
          PGPW: ${{ steps.cfg.outputs.new_pw }}
          REF: ${{ steps.cfg.outputs.new_ref }}
        run: |
          set +e
          echo "::add-mask::$PGPW"
          FOUND=$(python3 tools/find_pg_host.py "$REF" "$PGPW" eu-west-1 2>/dev/null | tail -1)
          if [ "$FOUND" = "${FOUND#OK }" ]; then echo "::warning::تعذّر التحقق"; exit 0; fi
          CH=$(echo "$FOUND" | cut -d" " -f2); CP=$(echo "$FOUND" | cut -d" " -f3); CU=$(echo "$FOUND" | cut -d" " -f4)
          SQL() { docker run --rm -e PGPASSWORD="$PGPW" postgres:17 psql -h "$CH" -p "$CP" -U "$CU" -d postgres -Atc "$1"; }
          SQL "select string_agg(table_name || '=' || (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from public.%I', table_name), false, true, '')))[1]::text, ' ') from information_schema.tables where table_schema='public' and table_type='BASE TABLE'" > /tmp/c.txt
          echo "::notice title=الجداول في الجديد::$(head -c 700 /tmp/c.txt)"
          echo "::notice title=المستخدمون::$(SQL "select string_agg(email, ', ') from auth.users")"
